pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.4'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        // MC 26 (NeoForge only — Yarn mappings for 26.x are not published).
        // 26.2 is still a NeoForge beta; 26.1 is the released line.
        version '26.2-neoforge',    '26.2-neoforge'
        version '26.1.2-neoforge',  '26.1.2-neoforge'
        version '1.21.11-fabric',   '1.21.11-fabric'
        version '1.21.11-neoforge', '1.21.11-neoforge'
        version '1.21.1-fabric',    '1.21.1-fabric'
        version '1.21.1-neoforge',  '1.21.1-neoforge'
        version '1.20.1-fabric',    '1.20.1-fabric'
        version '1.20.1-forge',     '1.20.1-forge'
        // 1.20.1-neoforge: net.neoforged.moddev 2.x targets NeoForge 1.20.4+
        vcsVersion = '1.21.11-fabric'
    }
}

rootProject.name = 'webgui'
